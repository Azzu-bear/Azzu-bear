    <text x="28" y="88">██╔══██╗╚══███╔╝██╔══██╗████╗ ████║</text>
    <text x="28" y="104">███████║  ███╔╝ ███████║██╔████╔██║</text>
    <text x="28" y="120">██╔══██║ ███╔╝  ██╔══██║██║╚██╔╝██║</text>
    <text x="28" y="136">██║  ██║███████╗██║  ██║██║ ╚═╝ ██║</text>
    <text x="28" y="152">╚═╝  ╚═╝╚══════╝╚═╝  ╚═╝╚═╝     ╚═╝</text>
  </g>

