<svg xmlns="http://www.w3.org/2000/svg" width="820" height="310" viewBox="0 0 820 310" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <!-- Lettering uses only plain ASCII (_ / \ |) so it stays aligned in any
       monospace font. Box-drawing block characters render at inconsistent
       widths in GitHub's font stack and overlap.
       Colours and sizes are presentation attributes so the banner still reads
       if CSS is not applied; <style> only adds motion. -->
  <style>
    @keyframes travel { 0% { transform: translateX(0); opacity: 0 }
                        6% { opacity: 1 } 92% { opacity: 1 }
                        100% { transform: translateX(468px); opacity: 0 } }
    @keyframes lit    { 0%, 100% { fill: #6e7681 } 8% { fill: #3fb950 } 24% { fill: #6e7681 } }
    @keyframes blink  { 0%, 50% { opacity: 1 } 51%, 100% { opacity: 0 } }
    @keyframes drain  { 0%, 100% { width: 96px } 50% { width: 22px } }
    .pkt    { animation: travel 4.5s linear infinite }
    .hop    { animation: lit 4.5s linear infinite }
    .h2     { animation-delay: .9s }
    .h3     { animation-delay: 1.8s }
    .h4     { animation-delay: 2.7s }
    .h5     { animation-delay: 3.6s }
    .cursor { animation: blink 1.05s step-end infinite }
    .bar    { animation: drain 4.5s ease-in-out infinite }
  </style>

  <rect width="820" height="310" rx="10" fill="#0d1117"/>
  <rect width="820" height="34" rx="10" fill="#161b22"/>
  <rect y="24" width="820" height="12" fill="#161b22"/>
  <circle cx="22" cy="17" r="5.5" fill="#ff5f57"/>
  <circle cx="42" cy="17" r="5.5" fill="#febc2e"/>
  <circle cx="62" cy="17" r="5.5" fill="#28c840"/>
  <text x="92" y="22" fill="#6e7681" font-size="13">azam@ucsc : ~</text>

  <g fill="#58a6ff" font-size="15" font-weight="700" xml:space="preserve">
    <text x="28" y="78">    _     _____     _     __  __ </text>
    <text x="28" y="96">   / \   |__  /    / \   |  \/  |</text>
    <text x="28" y="114">  / _ \    / /    / _ \  | |\/| |</text>
    <text x="28" y="132"> / ___ \  / /_   / ___ \ | |  | |</text>
    <text x="28" y="150">/_/   \_\/____| /_/   \_\|_|  |_|</text>
  </g>

  <defs>
    <clipPath id="typeclip">
      <rect x="28" y="168" height="18" width="270">
        <animate attributeName="width" values="0;270;270;0" keyTimes="0;0.5;0.92;1"
                 dur="4.5s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>
  <g clip-path="url(#typeclip)">
    <text x="28" y="182" fill="#c9d1d9" font-size="13">computer &amp; electrical engineering</text>
  </g>
  <rect class="cursor" x="292" y="170" width="7" height="14" fill="#3fb950"/>

  <text x="28" y="218" fill="#6e7681" font-size="13">$ ents --watch node-039</text>

  <text class="pkt" x="28" y="240" fill="#3fb950" font-size="13">&#9619;</text>

  <text class="hop"    x="28"  y="258" fill="#6e7681" font-size="13">soil</text>
  <text                x="72"  y="258" fill="#30363d" font-size="13">--&gt;</text>
  <text class="hop h2" x="112" y="258" fill="#6e7681" font-size="13">stm32</text>
  <text                x="168" y="258" fill="#30363d" font-size="13">--&gt;</text>
  <text class="hop h3" x="208" y="258" fill="#6e7681" font-size="13">esp32</text>
  <text                x="264" y="258" fill="#30363d" font-size="13">--&gt;</text>
  <text class="hop h4" x="304" y="258" fill="#6e7681" font-size="13">lora</text>
  <text                x="352" y="258" fill="#30363d" font-size="13">--&gt;</text>
  <text class="hop h5" x="392" y="258" fill="#6e7681" font-size="13">dirtviz</text>

  <text x="28"  y="288" fill="#3fb950" font-size="13">&#9679; online</text>
  <text x="112" y="288" fill="#6e7681" font-size="13">packets ok</text>
  <text x="212" y="288" fill="#6e7681" font-size="13">energy</text>
  <rect x="272" y="278" width="96" height="10" rx="2" fill="#21262d"/>
  <rect class="bar" x="272" y="278" width="96" height="10" rx="2" fill="#3fb950"/>
  <text x="392" y="288" fill="#d29922" font-size="13">hovering</text>
</svg>
